CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BUFFER_SIZE=2048

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NET_L2_WIFI_SHELL=y

CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y

CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
# 驱动自动重连必须关掉: 断开事件(如首次扫描 NO_AP_FOUND=201)后驱动会把
# 状态锁在 ESP32_STA_CONNECTING 并内部调用 esp_wifi_connect(), 从此应用层
# 所有连接请求都被拒绝(busy -1), 内部重连又静默卡死, 永远无法恢复。
# 关掉后驱动断开即回 ESP32_STA_STARTED, 由 wifi.c 自己的重试循环接管。
CONFIG_ESP32_WIFI_STA_RECONNECT=n
CONFIG_ESP32_WIFI_IRAM_OPT=n
CONFIG_ESP32_WIFI_RX_IRAM_OPT=n

# 网络缓冲池: 数据块必须 ≥1514(一帧一个 buffer), 否则
# 一帧要拆成 12 个 128B 碎片, 而小 RX 池连一个全尺寸帧都装不下,
# 任何 ≥1281B 的单帧(SSDP/mDNS 公告等)到达都必然报
# "Data buffer (1514) allocation failed" 丢帧 —— 不需要突发, 一帧就够
CONFIG_NET_BUF_DATA_SIZE=1600
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=8
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
# 防止扫描结果事件丢失
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

CONFIG_NET_LOG=y

# 堆内存大小由板级 Kconfig.defconfig 提供(esp32 wifi 需要 51200),
# 不要在这里设小值, 否则 esp_wifi_start() 内存分配失败


# ===== MQTT Configuration =====
CONFIG_NETWORKING=y
# CONFIG_MQTT_LIB=y

# MQTT 依赖 TCP 传输。Zephyr 3.7 起 NET_TCP 默认关闭且 MQTT_LIB 不会
# 自动 select, 必须显式开启, 否则 socket(SOCK_STREAM) 创建即失败,
# mqtt_connect() 报 -107 (minimal libc 中 EPROTOTYPE=107, 非 Linux 的 ENOTCONN)
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y

# HTTP 客户端 
CONFIG_HTTP_CLIENT=y
CONFIG_POSIX_API=y
CONFIG_NET_HTTP_LOG_LEVEL_DBG=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# 1. 启用安全套接字和证书
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
# 开启 PEM 证书解析
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
# 证书相关
# TLS configuration
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
# CONFIG_MBEDTLS_ENABLE_HEAP=y
# CONFIG_MBEDTLS_HEAP_SIZE=32768
# 服务器的证书链握手消息约 4758 字节, 超过 4096 时 mbedTLS 3.6 在
# ssl_msg.c 报 "requesting more data than fits" → -0x7100 (BAD_INPUT_DATA)
# 握手失败。8192 足够容纳证书链和后续的响应记录。
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=8192

CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=1
# TLS 握手在 zsock_connect() 内完成(Zephyr 3.7), 默认 3s 上限在工地
# 弱网下容易超时, 放宽到 10s
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=10000

# ========== time ===========
CONFIG_SNTP=y

